<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Waffle by Michael O'Sullivan</title>
    <meta
      name="description"
      content="Waffle by Michael O'Sullivan. A clone of the Waffle word sliding game: rearrange the letters until every row and column is a word."
    />
    <meta name="author" content="Michael O'Sullivan" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Waffle by Michael O'Sullivan" />
    <meta property="og:title" content="Waffle by Michael O'Sullivan" />
    <meta property="og:description" content="A clone of the Waffle word sliding game." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Waffle by Michael O'Sullivan" />
    <meta name="twitter:description" content="A clone of the Waffle word sliding game." />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-0.5 -0.5 6 6'%3E%3Crect x='-0.5' y='-0.5' width='6' height='6' rx='1.2' fill='%23070e0a'/%3E%3Cg fill='%2322c55e'%3E%3Crect x='0' y='0' width='1' height='1'/%3E%3Crect x='1' y='0' width='1' height='1'/%3E%3Crect x='2' y='0' width='1' height='1'/%3E%3Crect x='3' y='0' width='1' height='1'/%3E%3Crect x='4' y='0' width='1' height='1'/%3E%3Crect x='0' y='1' width='1' height='1'/%3E%3Crect x='2' y='1' width='1' height='1'/%3E%3Crect x='4' y='1' width='1' height='1'/%3E%3Crect x='0' y='2' width='1' height='1'/%3E%3Crect x='1' y='2' width='1' height='1'/%3E%3Crect x='2' y='2' width='1' height='1'/%3E%3Crect x='3' y='2' width='1' height='1'/%3E%3Crect x='4' y='2' width='1' height='1'/%3E%3Crect x='0' y='3' width='1' height='1'/%3E%3Crect x='2' y='3' width='1' height='1'/%3E%3Crect x='4' y='3' width='1' height='1'/%3E%3Crect x='0' y='4' width='1' height='1'/%3E%3Crect x='1' y='4' width='1' height='1'/%3E%3Crect x='2' y='4' width='1' height='1'/%3E%3Crect x='3' y='4' width='1' height='1'/%3E%3Crect x='4' y='4' width='1' height='1'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1>Waffle</h1>
        <p class="byline">by Michael O'Sullivan</p>
        <p class="subtitle" id="subtitle">Daily Waffle</p>
      </header>

      <main>
        <div class="board" id="board" role="grid" aria-label="Waffle board"></div>
        <p class="hud" id="hud"><strong id="swaps">15</strong> <span id="hud-label">swaps remaining</span></p>
        <div class="stars" id="stars" aria-label="Stars earned"></div>

        <div class="actions">
          <button class="button" id="play-daily" type="button">Daily waffle</button>
          <button class="button button--ghost" id="play-practice" type="button">Practice</button>
        </div>
        <div class="actions actions--sub">
          <button class="button button--ghost" id="stats" type="button">Stats &amp; archive</button>
          <button class="button button--ghost" id="share" type="button">Share</button>
          <button class="button button--ghost" id="sound" type="button" aria-pressed="true">Sound: on</button>
          <button class="button button--ghost" id="help" type="button">How to play</button>
        </div>
      </main>

      <footer class="copyright">&copy; MMXXVI Michael O'Sullivan</footer>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal__head">
          <h2 id="modal-title"></h2>
          <button class="modal__close" id="modal-close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="modal__body" id="modal-body"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/waffle-core.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/puzzles.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
